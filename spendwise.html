<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spendwise</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fe;--card:#fff;--ink:#111827;--mut:#667085;--line:#eaeff8;--acc:#2563eb;--on:#fff;--bad:#e11d48;--ok:#16c784;--soft:#e8efff;--sh:0 2px 14px rgba(30,64,175,.07);--sh2:0 6px 24px rgba(30,64,175,.18);--g1:#1e3a8a;--g2:#2563eb;--g3:#0ea5e9;--hs:rgba(37,99,235,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#000;--card:#101010;--ink:#f2f2f2;--mut:#9a9a9a;--line:#232323;--acc:#42a5f5;--on:#000;--bad:#fb7185;--ok:#34d399;--soft:#14222d;--sh:none;--sh2:none;color-scheme:dark}}
:root[data-theme="dark"]{--card:#101010;--ink:#f2f2f2;--mut:#9a9a9a;--bad:#fb7185;--ok:#34d399;--sh:none;--sh2:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:14px 18px 130px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hd{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.hd h1{font-size:clamp(22px,7vw,30px);font-weight:800;letter-spacing:-.02em;margin:0}
.acts{display:flex;align-items:center;gap:8px}
.plus,.ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);color:var(--acc);font-size:28px;line-height:1}
.ib{font-size:19px;display:grid;place-items:center;padding:0}.fab2{height:38px;padding:0 14px;border-radius:19px;border:0;background:var(--card);box-shadow:var(--sh);color:var(--acc);font-weight:600;font-size:14px}
.mnav{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 14px}
.mnav b{min-width:150px;text-align:center;font-weight:600}
.mnav button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:18px;color:var(--acc)}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:17px;font-weight:700;margin:0 0 4px}
.mut{color:var(--mut)}.sm{font-size:13px}.bad{color:var(--bad)}
.prog{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:6px}.prog div{height:100%;border-radius:5px}
.prog.lg{height:14px;border-radius:8px;margin:14px 0 12px}
.pair{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pair span{display:flex;align-items:center;gap:8px}
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;padding:0}
.bars{display:block;width:100%;height:84px;margin-top:12px}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px}
.donut svg{width:140px;height:140px;flex:none}
.leg{flex:1;min-width:170px}
.lr{display:flex;align-items:center;gap:10px;padding:6px 0}
.lr i,.chip i{width:11px;height:11px;border-radius:50%;flex:none}
.lr .n{flex:1;min-width:0;font-weight:500}.lr .a{color:var(--mut);font-weight:600}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:9px 0}
.dot{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:20px}
.tx .n{flex:1;min-width:0}.tx .n b,.tx .n span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .n b{font-weight:600}
.dh{font-size:13px;color:var(--mut);margin:16px 4px 8px;display:flex;justify-content:space-between;font-weight:600}
.tools{display:flex;gap:8px;margin-bottom:12px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.tools input{flex:2}.tools select{flex:1}
.empty{text-align:center;padding:30px 14px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:14px;padding:13px 18px;font-weight:600}
.btn.ghost{background:var(--soft);color:var(--acc)}
.btn.ghost.bad{background:none;border:1px solid var(--line);color:var(--bad)}
.br{padding:12px 0;border-bottom:1px solid var(--line)}.br:last-of-type{border-bottom:0}
.br .top{display:flex;align-items:center;gap:8px}
.br .top b{flex:1;font-weight:600}.br input{width:110px;padding:8px 10px}
.x{background:none;border:0;color:var(--mut);font-size:22px;padding:0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}
.tabs div{pointer-events:auto;display:flex;max-width:520px;width:100%;gap:4px;background:var(--card);border-radius:28px;padding:8px;box-shadow:var(--sh2)}
.tabs button{flex:1;background:none;border:0;padding:8px 4px;border-radius:20px;color:var(--mut);font-size:12px;font-weight:500}
.tabs button.on{color:var(--acc);background:var(--soft);font-weight:700}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}
.sheet{position:fixed;inset:0;background:rgba(10,18,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.box{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.box{animation:none}}
.box .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box label{display:block;font-size:13px;color:var(--mut);margin:12px 0 0}
.box label input,.box label select{margin-top:4px;color:var(--ink)}
#fa{font-size:30px;font-weight:700;padding:8px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:20px;padding:7px 13px;font-size:14px}
.chip.on{border-color:var(--acc);background:var(--soft);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box .btn{margin-top:16px}.box .row .btn{flex:1}
textarea{width:100%;height:120px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px;font:12px monospace;margin-top:8px}
.err{outline:2px solid var(--bad)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#lock[hidden]{display:none}
.dots{display:flex;gap:14px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}.dots i.f{background:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:24px;font-weight:600}

.hero{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);color:#fff;border-radius:26px;padding:22px 20px;margin-bottom:14px;box-shadow:0 10px 28px var(--hs);position:relative;overflow:hidden;animation:rise .4s ease both}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
.hl{font-size:13px;opacity:.85;font-weight:500}
.hb{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.hs{font-size:13px;opacity:.9}.hero .bad{color:#fecdd3}
.hp{height:10px;border-radius:6px;background:rgba(255,255,255,.25);margin:18px 0 10px;overflow:hidden}
.hp div{height:100%;border-radius:6px;transition:width .6s ease}
.hf{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.hlk{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;padding:4px 10px;font-weight:600;font-size:13px}
.ins{display:flex;align-items:center;gap:12px;padding:8px 0}.ins .dot{background:var(--soft)}
.ins .n b,.ins .n span{display:block}.ins .n b{font-weight:600}
button{transition:transform .12s}button:active{transform:scale(.96)}
.box::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 12px}
.hd h1{min-width:0}
.hero.over{background:linear-gradient(135deg,#9f1239,#e11d48 60%,#fb7185);box-shadow:0 10px 28px rgba(225,29,72,.35)}
.hero.warn{background:linear-gradient(135deg,#b45309,#d97706 60%,#f59e0b);box-shadow:0 10px 28px rgba(217,119,6,.35)}
.chip2{float:right;background:rgba(255,255,255,.22);border-radius:12px;padding:2px 10px;font-weight:600;font-size:12px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--sh)}


.ir{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.ir.dim{opacity:.55}.ir .n{flex:1;min-width:0}
.ir .n b,.ir .n span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir .n b{font-weight:500}.ir .am{font-weight:600}
.ir select{width:128px;padding:6px 8px;font-size:13px}
.ir input[type=checkbox]{width:20px;height:20px;padding:0;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:20;font-size:14px;max-width:90%;text-align:center}
.ml{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px;min-height:30px}.ml b{font-size:17px;font-weight:700}
.pill{border:0;background:var(--card);box-shadow:var(--sh);border-radius:18px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--acc)}
.wk{display:grid;grid-template-columns:22px repeat(7,1fr) 22px;gap:4px;align-items:center;margin:0 0 12px}
.wa{background:none;border:0;font-size:24px;line-height:1;color:var(--mut);padding:0}
.dy{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:16px;border:1.5px solid transparent;background:var(--card);box-shadow:var(--sh);color:var(--mut)}
.dy small{font-size:11px;font-weight:600}.dy b{font-size:16px;font-weight:700;color:var(--ink)}
.dy i{width:5px;height:5px;border-radius:50%;background:transparent}.dy.has i{background:var(--acc)}
.dy.td{border-color:var(--acc)}.dy.inw{background:var(--soft)}
.dy.sel{background:var(--acc);color:var(--on)}.dy.sel b{color:var(--on)}.dy.sel.has i{background:var(--on)}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.stats b{display:block;font-size:16px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.sr:last-child{border-bottom:0}
.sr>span{min-width:0;flex:1}.sr b{display:block;font-weight:600}.sr .mut{display:block}
.sr .btn{padding:9px 14px;flex:none}
.tg{width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(20px)}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border:1.5px solid var(--line);background:none;border-radius:14px;font-size:12px;color:var(--ink)}
.sw button.on{border-color:var(--acc);background:var(--soft);font-weight:700}
.sw i{width:24px;height:24px;border-radius:50%}
.fld{display:block;font-size:13px;color:var(--mut);margin-top:12px}.fld input,.fld select{margin-top:4px;color:var(--ink)}
.nt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.nt button{background:var(--card);box-shadow:var(--sh);border:1.5px solid transparent;border-radius:16px;padding:10px 10px;text-align:left;min-width:0}
.nt button.on{border-color:var(--acc);background:var(--soft)}
.nt b{display:block;font-size:15px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="ib" id="bk" onclick="setTab(V.prev)" aria-label="Back" style="display:none">‹</button><h1 id="ttl">Spending</h1></div><div class="acts" id="acts"><button class="ib" onclick="openSt()" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button><button class="ib" id="syn" onclick="openImport()" aria-label="Import SMS messages">✉</button><button class="plus" onclick="openM()" aria-label="Add expense">+</button></div></div>
  <div class="mnav" id="mnav"><button onclick="shift(-1)" aria-label="Previous month">‹</button><b id="mt"></b><button onclick="shift(1)" aria-label="Next month">›</button></div>
  <main id="main"></main>
</div>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="lock" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<script>
const $=s=>document.querySelector(s),K='spendwise-v1',PAL=['#2f6bff','#ff5c9a','#7c5cff','#ff9f2e','#19c3b1','#22c55e','#ef4444','#64748b','#0ea5e9'],PM=['Cash','Mobile money','Card','Bank transfer'],CUR=['$','€','£','KSh','USh','TSh','₦','R','₹'];
const DEF=['Food & groceries','Transport','Bills & utilities','Airtime & data','Rent','Shopping','Health','Entertainment','Other'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.tx)S={tx:[],cur:'KSh',cats:DEF.map((n,i)=>({name:n,color:PAL[i%PAL.length],budget:0}))};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pd=s=>new Date(s+'T00:00'),addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return dstr(d)},wkStart=s=>addD(s,-((pd(s).getDay()+6)%7)),DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const V={tab:'ov',prev:'ov',r:'m',sel:today(),q:'',f:'',get ym(){return this.sel.slice(0,7)},set ym(v){if(v!==this.ym){const[y,m]=v.split('-').map(Number);this.sel=v+'-'+pad(Math.min(+this.sel.slice(8),new Date(y,m,0).getDate()))}}};let M={};
const TH={ocean:{n:'Ocean',a:['#2563eb','#e8efff','#f4f7fe','#eaeff8'],da:['#42a5f5','#14222d'],g:['#1e3a8a','#2563eb','#0ea5e9']},
emerald:{n:'Emerald',a:['#00875a','#e6f3ee','#f2f8f5','#e0eee8'],da:['#00c853','#0b2717'],g:['#064e3b','#047857','#10b981']},
royal:{n:'Royal',a:['#6a4bc4','#f0edf9','#f6f4fd','#e9e5f5'],da:['#b39ddb','#24212a'],g:['#4c1d95','#6d28d9','#8b5cf6']},
sunset:{n:'Sunset',a:['#c2410c','#f9ece7','#fcf6f2','#f3e8e1'],da:['#ffa726','#2f2210'],g:['#9a3412','#c2410c','#ea580c']},
rose:{n:'Rose',a:['#c2185b','#f9e8ef','#fdf4f7','#f6e6ec'],da:['#f48fb1','#2d1f24'],g:['#9d174d','#db2777','#f472b6']}};
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'};
const mq=matchMedia('(prefers-color-scheme: dark)'),modeOf=()=>S.mode||(S.theme==='light'||S.theme==='dark'?S.theme:'system');
function applyTheme(){const md=modeOf(),dk=md==='dark'||(md==='system'&&mq.matches),t=TH[S.col]||TH.ocean,r=document.documentElement,sp=(k,v)=>r.style.setProperty(k,v);
  r.dataset.theme=dk?'dark':'light';
  sp('--acc',dk?t.da[0]:t.a[0]);sp('--soft',dk?t.da[1]:t.a[1]);sp('--on',dk?'#000':'#fff');sp('--bg',dk?'#000':t.a[2]);sp('--line',dk?'#232323':t.a[3]);
  sp('--g1',t.g[0]);sp('--g2',t.g[1]);sp('--g3',t.g[2]);sp('--hs',rgba(t.g[1],.35));
  let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}m.content=dk?'#000000':t.a[2]}
const onMq=()=>{if(modeOf()==='system'){applyTheme();render()}};try{mq.addEventListener('change',onMq)}catch(e){try{mq.addListener(onMq)}catch(e2){}}
function setMode(k){S.mode=k;delete S.theme;save();applyTheme();render()}
function setCol(k){S.col=k;save();applyTheme();render()}
function pickDay(d){V.sel=d;V.r='d';render()}
function setR(r){V.r=r;render()}
function goToday(){V.sel=today();render()}
function stepP(n){if(V.r==='m'){shift(n);return}V.sel=addD(V.sel,V.r==='w'?7*n:n);render()}
function openSt(){V.prev=V.tab==='st'?V.prev:V.tab;setTab('st')}
let BIO={k:'',busy:false},UL=0;
const bioOk=()=>!!(window.Android&&Android.canBiometric&&Android.canBiometric()),bioOn=()=>!!(S.pin&&S.bio&&bioOk());
function bioAsk(k){if(BIO.busy||!bioOk())return;BIO={k,busy:true};Android.authenticate()}
window.onBioResult=ok=>{const k=BIO.k;BIO={k:'',busy:false};
  if(k==='enable'){if(ok){S.bio=1;save();toast('Fingerprint unlock is on')}else toast('Fingerprint was not turned on');render();return}
  if(ok&&!$('#lock').hidden&&PN.mode==='unlock'){UL=Date.now();$('#lock').hidden=true;render()}};
function toggleBio(){if(S.bio){S.bio=0;save();render();return}if(!S.pin){toast('Set a PIN first');return}bioAsk('enable')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>S.cur+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const cat=n=>S.cats.find(c=>c.name===n)||{name:n,color:'#8a8f98',budget:0};
const sum=a=>a.reduce((s,t)=>s+t.amt,0);
const inM=ym=>S.tx.filter(t=>t.date.startsWith(ym));
function shift(n){let[y,m]=V.ym.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}V.ym=y+'-'+pad(m);render()}
function setTab(t){V.tab=t;render();scrollTo(0,0)}
function byCat(list){const m={};list.forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function fmtDay(d){return new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
const EMO={'Food & groceries':'🍽️','Transport':'🚗','Bills & utilities':'💡','Airtime & data':'📱','Rent':'🏠','Shopping':'🛍️','Health':'💊','Entertainment':'🎬','Other':'📦'},ico=n=>EMO[n]||'🏷️';
function txRow(t){const c=cat(t.cat);return `<button class="tx" onclick="openM('${t.id}')"><span class="dot" style="background:${c.color}24">${ico(t.cat)}</span><span class="n"><b>${esc(t.note||t.cat)}</b><span class="mut sm">${esc(t.cat)}${t.fee?' · incl. '+fmt(t.fee)+' fee':''}</span></span><b>${fmt(t.amt)}</b></button>`}

    const wb=wd.map(([d,v],i)=>{const h=v?Math.max(4,v/wm*66):2,on=d===V.sel&&r==='d',lit=r==='w'||on;
      return `<g><rect x="${i*40+8}" y="${94-h}" width="24" height="${h}" rx="6" fill="${v?'var(--acc)':'var(--line)'}" opacity="${v&&!lit?.5:1}"><title>${fmtDay(d)}: ${fmt(v)}</title></rect>${v?`<text x="${i*40+20}" y="${90-h}" text-anchor="middle" font-size="10" style="fill:var(--mut)">${kf(v)}</text>`:''}<text x="${i*40+20}" y="110" text-anchor="middle" font-size="11" font-weight="${on?700:500}" style="fill:${on?'var(--ink)':'var(--mut)'}">${DN[i]}</text></g>`}).join('');

function lim(){

  const IC={ov:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',tx:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',mg:'<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'};
  $('#tabs').innerHTML=[['ov','Home'],['tx','Transactions'],['mg','Budgets']].map(([k,l])=>`<button class="${V.tab===k?'on':''}" onclick="setTab('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${l}</button>`).join('');
  $('#main').innerHTML=(window.Android&&!Android.hasPermission()?'<button class="card" style="width:100%;text-align:left;border:0;color:var(--bad);font-weight:600" onclick="permHelp()">⚠ Not reading your M-Pesa messages yet. Tap to fix</button>':'')+(V.tab==='ov'?overview():V.tab==='tx'?list():V.tab==='mg'?manage():settings());
}
function openM(id){
  const t=id?S.tx.find(x=>x.id===id):null;M={id:id||null,cat:t?t.cat:S.cats[0].name};
  $('#sheet').innerHTML=`<div class="box" role="dialog" aria-modal="true"><div class="row"><h2 style="margin:0">${t?'Edit expense':'Add expense'}</h2><button class="x" onclick="closeM()" aria-label="Close">×</button></div>
  <label>Amount<input id="fa" inputmode="decimal" placeholder="0" value="${t?t.amt:''}"></label><div class="chips" id="chips"></div>
  <label>Note<input id="fn" placeholder="What was it for?" value="${t?esc(t.note):''}"></label>
  <div class="two"><label>Date<input id="fd" type="date" value="${t?t.date:today()}"></label><label>Paid with<select id="fm">${PM.map(p=>`<option${t&&t.method===p?' selected':''}>${p}</option>`).join('')}</select></label></div>
  <div class="row"><button class="btn" onclick="saveTx()">Save expense</button>${t?'<button class="btn ghost bad" onclick="delTx()">Delete</button>':''}</div></div>`;
  chips();$('#sheet').hidden=false;setTimeout(()=>$('#fa').focus(),40)}
function chips(){$('#chips').innerHTML=S.cats.map((c,i)=>`<button class="chip${c.name===M.cat?' on':''}" onclick="M.cat=S.cats[${i}].name;chips()"><i style="background:${c.color}"></i>${esc(c.name)}</button>`).join('')}
function closeM(){$('#sheet').hidden=true}
function saveTx(){
  const a=parseFloat($('#fa').value.replace(/,/g,''));if(!(a>0)){$('#fa').classList.add('err');$('#fa').focus();return}
  const d=$('#fd').value||today(),r={amt:a,cat:M.cat,note:$('#fn').value.trim(),date:d,method:$('#fm').value};
  if(M.id){const o=S.tx.find(x=>x.id===M.id);Object.assign(o,r);if(o.key)S.map[o.key]=r.cat}else S.tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),...r});
  V.sel=d;save();closeM();render()}
function delTx(){if(confirm('Delete this expense?')){S.tx=S.tx.filter(x=>x.id!==M.id);save();closeM();render()}}
function setB(i,v){S.cats[i].budget=Math.max(0,parseFloat(v)||0);save();render()}
function addCat(){const n=$('#nc').value.trim();if(!n||S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase()))return;S.cats.push({name:n,color:PAL[S.cats.length%PAL.length],budget:0});save();render()}
function delCat(i){if(S.cats.length<2)return;if(confirm('Remove this category? Existing expenses keep their label.')){S.cats.splice(i,1);save();render()}}
function csv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',t=['Date,Category,Amount,Paid with,Note',...[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,q(x.cat),x.amt,q(x.method||''),q(x.note)].join(','))].join('\n');
  $('#out').innerHTML='<textarea id="ta" readonly></textarea><p class="sm mut">Copy this into a spreadsheet or a text file.</p>';const ta=$('#ta');ta.value=t;ta.select();try{document.execCommand('copy')}catch(e){}}
function wipe(){if(confirm('Erase all expenses and settings? This cannot be undone.')){S.tx=[];S.cats=DEF.map((n,i)=>({name:n,color:PAL[i%PAL.length],budget:0}));save();render()}}
function sample(){
  const R={'Food & groceries':[['Groceries',900,3200],['Lunch',250,600],['Coffee',120,300]],'Transport':[['Fuel',1500,3000],['Ride home',200,700]],'Bills & utilities':[['Electricity',1200,2500]],'Airtime & data':[['Data bundle',250,1000]],'Shopping':[['Clothes',1200,4000]],'Health':[['Pharmacy',300,1500]],'Entertainment':[['Movie night',500,1200]],'Rent':[['Rent',18000,18000]],'Other':[['Gift',500,2000]]};
  const names=Object.keys(R),maxD=+today().slice(8),ym=today().slice(0,7);
  for(let i=0;i<34;i++){const c=names[Math.floor(Math.random()*names.length)],r=R[c][Math.floor(Math.random()*R[c].length)];
    S.tx.push({id:'s'+i+Math.random().toString(36).slice(2,5),amt:Math.round((r[1]+Math.random()*(r[2]-r[1]))/10)*10,cat:c,note:r[0],date:ym+'-'+pad(1+Math.floor(Math.random()*maxD)),method:PM[Math.floor(Math.random()*3)]})}
  [['Food & groceries',15000],['Transport',8000],['Entertainment',3000]].forEach(([n,b])=>{const c=S.cats.find(x=>x.name===n);if(c)c.budget=b});
  save();V.sel=today();render()}
S.map=S.map||{};if(!S.curSet&&S.cur==='$')S.cur='KSh';if(!S.v2){S.cats.forEach((c,i)=>c.color=PAL[i%PAL.length]);S.v2=1}
let I={rows:[],skip:0};
const RULES=[['Airtime & data',/airtime|data bundle|bundle|top.?up|bingwa/i],['Transport',/uber|bolt|little ?cab|taxi|fuel|petrol|shell|rubis|total ?energies|matatu|fare|parking|sgr|\bbus\b/i],['Bills & utilities',/kplc|kenya power|electric|power|water|wifi|internet|zuku|dstv|gotv|startimes|insurance|subscription|\bbills?\b|nhif|\bsha\b|\bkra\b/i],['Rent',/\brent\b|landlord/i],['Health',/pharmacy|chemist|hospital|clinic|medic|dental|\blab\b/i],['Entertainment',/cinema|movie|netflix|showmax|spotify|\bbet\b|sportpesa|\bclub\b|ticket|game/i],['Food & groceries',/naivas|carrefour|quickmart|tuskys|chandarana|cleanshelf|artcaffe|supermarket|grocer|market|restaurant|cafe|kfc|java|pizza|food|eatery|butchery|bakery|glovo|chicken|hotel|mama/i],['Shopping',/jumia|kilimall|\bshop|store|mall|cloth|fashion|boutique|amazon|electronics|hardware/i]];
const hs=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7).toString(36);
function guess(m,key){
  if(key&&S.map[key]&&S.cats.some(c=>c.name===S.map[key]))return S.map[key];
  for(const[n,r]of RULES)if(r.test(m)&&S.cats.some(c=>c.name===n))return n;
  return S.cats.some(c=>c.name==='Other')?'Other':S.cats[0].name}
function parseSms(raw,ts){
  const m=raw.replace(/\s+/g,' ').trim();if(m.length<12)return null;
  if(/\b(otp|verification code|one.time)\b/i.test(m))return null;
  if(/\b(received|credited|deposited|salary)\b/i.test(m)&&!/\b(paid|sent|bought|purchase|withdraw)/i.test(m))return{skip:1};
  if(!/\b(paid|sent|bought|purchase\w*|payment|withdraw\w*|spent|debited|transferred|airtime)\b/i.test(m))return null;
  const re=/(?:KES|KSHS?|UGX|TZS|NGN|USD|[$€£₦])\s?([\d,]+(?:\.\d{1,2})?)/gi;let a=0,x;
  while((x=re.exec(m))){if(!/(bal|fee|charge|cost)[^.]{0,20}$/i.test(m.slice(Math.max(0,x.index-28),x.index))){a=parseFloat(x[1].replace(/,/g,''));break}}
  if(!(a>0))return null;
  const dm=m.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);let date=ts?(d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()))(new Date(ts)):today();
  if(dm&&+dm[2]<=12&&+dm[1]<=31){let y=+dm[3];if(y<100)y+=2000;date=y+'-'+pad(+dm[2])+'-'+pad(+dm[1])}
  const cm=m.match(/^([A-Z0-9]{8,12})\s+confirmed/i),id=cm?cm[1].toUpperCase():'h'+hs(m);
  const mm=m.match(/\b(?:paid to|sent to|payment to|purchase at|bought at|spent at|at|to)\s+([A-Za-z0-9][A-Za-z0-9 .&'*-]{1,34}?)(?=\s+(?:on|for|acc|a\/c|ref|using|via|from)\b|\s+\d{9,}|[.,]|$)/i);
  const who=(mm?mm[1]:'').replace(/\s*\d[\d\s]*$/,'').trim(),key=who.toLowerCase().slice(0,24);
  const note=who?who.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()):/airtime/i.test(m)?'Airtime':/withdraw/i.test(m)?'Cash withdrawal':'Expense';
  const fm=m.match(/transaction cost,?\s*(?:KES|KSHS?)?\s?([\d,]+(?:\.\d{1,2})?)/i),fee=fm?parseFloat(fm[1].replace(/,/g,'')):0;return{id,amt:a+fee,fee,date,note,key,cat:guess(who+' '+m,key),method:/card|visa|mastercard/i.test(m)?'Card':/bank|a\/c|account/i.test(m)?'Bank transfer':'Mobile money'}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
function syncSms(auto){
  if(!window.Android)return;
  if(!Android.hasPermission()){if(!auto||!S.asked){S.asked=1;save();Android.requestPermission()}return}
  let g=[];try{g=JSON.parse(Android.readSms(S.last?Math.ceil((Date.now()-S.last)/864e5)+2:60,S.senders||'MPESA'))}catch(e){}
  const seen=new Set(S.tx.map(x=>x.sms).filter(Boolean));let n=0;
  g.reverse().forEach(x=>{const p=parseSms(x.body,x.ts);if(!p||p.skip||seen.has(p.id))return;seen.add(p.id);
    S.tx.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),amt:p.amt,cat:p.cat,note:p.note,date:p.date,method:p.method,sms:p.id,key:p.key,fee:p.fee});n++});
  S.last=Date.now();save();
  if(n){V.sel=today();render();{const Q=lim();toast('Added '+n+' expense'+(n>1?'s':'')+' from SMS'+(Q.L&&Q.tot>Q.L?' · You are over your limit':Q.L&&Q.pct>=80?' · '+Math.round(Q.pct)+'% of limit used':''))}}else if(!auto)toast('No new expenses found')}
function openImport(){if(window.Android){if(Android.hasPermission())syncSms(false);else permHelp();return}openPaste()}
function permHelp(){$('#sheet').innerHTML=`<div class="box" data-k="imp"><div class="row"><h2 style="margin:0">Allow SMS access</h2><button class="x" onclick="closeM()" aria-label="Close">×</button></div><p class="mut sm">Spendwise needs permission to read your M-Pesa messages. If Android blocks it, open app settings, tap the ⋮ menu and choose Allow restricted settings, then allow SMS. Or paste your messages instead.</p><button class="btn" style="width:100%" onclick="closeM();Android.requestPermission()">Try again</button><button class="btn ghost" style="width:100%" onclick="Android.openSettings();closeM()">Open app settings</button><button class="btn ghost" style="width:100%" onclick="openPaste()">Paste messages instead</button></div>`;$('#sheet').hidden=false}
function openPaste(){
  $('#sheet').innerHTML=`<div class="box" data-k="imp"><div class="row"><h2 style="margin:0">Import from SMS</h2><button class="x" onclick="closeM()" aria-label="Close">×</button></div><p class="mut sm">Copy your payment messages (mobile money or bank) and paste them below. Spendwise finds the amount, date and merchant, then sorts each one into a category. Nothing leaves this device.</p><textarea id="ib" style="height:140px;font:14px system-ui" placeholder="Paste messages here, one after another"></textarea><div id="ip"></div><button class="btn" id="ib2" onclick="findSms()">Find expenses</button></div>`;$('#sheet').hidden=false}
function findSms(){
  const t=$('#ib').value.trim();if(!t)return;
  let ch=t.split(/\n\s*\n/);
  if(ch.length===1){const ls=t.split(/\n/);if(ls.filter(l=>/(KES|KSH|UGX|TZS|NGN|USD|[$€£₦])\s?\d/i.test(l)).length>1)ch=ls}
  const seen=new Set(S.tx.map(x=>x.sms).filter(Boolean));I={rows:[],skip:0};
  ch.forEach(c=>{const p=parseSms(c);if(!p)return;if(p.skip){I.skip++;return}p.dup=seen.has(p.id);p.on=!p.dup;seen.add(p.id);I.rows.push(p)});
  $('#ip').innerHTML=(I.rows.length?`<div style="margin-top:10px">${I.rows.map((r,i)=>`<div class="ir${r.dup?' dim':''}"><input type="checkbox"${r.on?' checked':''}${r.dup?' disabled':''} onchange="I.rows[${i}].on=this.checked;cnt()" aria-label="Include ${esc(r.note)}"><span class="n"><b>${esc(r.note)}</b><span class="mut sm">${fmtDay(r.date)}${r.dup?' · Already imported':''}</span></span><span class="am">${fmt(r.amt)}</span><select onchange="I.rows[${i}].cat=this.value" aria-label="Category">${S.cats.map(c=>`<option${c.name===r.cat?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`).join('')}</div>`:'<p class="mut sm" style="margin-top:10px">No expenses found. Paste full messages that include the amount.</p>')+(I.skip?`<p class="mut sm">${I.skip} money-received message${I.skip>1?'s':''} skipped.</p>`:'');
  cnt()}
function cnt(){const n=I.rows.filter(r=>r.on).length,b=$('#ib2');b.textContent=n?`Import ${n} expense${n>1?'s':''}`:'Find expenses';b.onclick=n?addSms:findSms}
function addSms(){
  const L=I.rows.filter(r=>r.on);
  L.forEach(r=>{S.tx.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),amt:r.amt,cat:r.cat,note:r.note,date:r.date,method:r.method,sms:r.id,fee:r.fee});if(r.key)S.map[r.key]=r.cat});
  if(L.length)V.sel=L.map(r=>r.date).sort().pop();save();closeM();render()}
document.addEventListener('keydown',e=>{if($('#sheet').hidden)return;if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.id!=='x'&&!e.target.closest('[data-k=imp]'))saveTx()});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeM()});
applyTheme();render();lockNow();
if(window.Android){$('#syn').textContent='↻';$('#syn').setAttribute('aria-label','Sync SMS now');window.onAppResume=()=>{if(S.pin&&Date.now()-LB>(S.lockAfter==null?30:S.lockAfter)*1000&&Date.now()-UL>1500)lockNow();render();syncSms(true)};window.onAppPause=()=>{LB=Date.now()};window.onSmsPermission=()=>{render();if(Android.hasPermission())syncSms(false);else permHelp()};setTimeout(()=>syncSms(true),500)}
</script>
