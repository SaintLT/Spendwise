<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spendwise</title>
<link rel="stylesheet" href="spendwise.css">
</head>
<body>
<div class="wrap">
  <div class="hd"><div class="hl2"><button class="ib" id="bk" onclick="goBack()" aria-label="Back" style="display:none">‹</button><button class="av" id="av" onclick="openPf()" aria-label="Open your profile"></button><div id="gr" class="gr"><div class="g1" id="g1"></div><div class="g2" id="g2"></div></div><h1 id="ttl"></h1></div><div class="acts" id="acts"><button class="ib" id="syn" onclick="openImport()" aria-label="Import SMS messages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></button><button class="ib" onclick="openSt()" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button><button class="plus" id="plus" onclick="openM()" aria-label="Add expense">+</button></div></div>
  <div class="mnav" id="mnav"><button onclick="shift(-1)" aria-label="Previous month">‹</button><b id="mt"></b><button onclick="shift(1)" aria-label="Next month">›</button></div>
  <main id="main"></main>
</div>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="lock" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<script src="spendwise.js"></script>
</body>
</html>
