return`<h1>Stats</h1><div class="sc" style="margin-bottom:10px">${[[7,'7D'],[30,'1M'],[90,'3M'],[180,'6M'],[0,'All'],['c','Custom']].map(r=>`<button class="g ${S.r===r[0]?'on':''}" onclick="S.r=${typeof r[0]=='string'?"'c'":r[0]};go()">${r[1]}</button>`).join('')}</div>
${S.r=='c'?`<div class="r"><input type="date" value="${S.c1}" onchange="S.c1=this.value;go()"><input type="date" value="${S.c2}" onchange="S.c2=this.value;go()"></div>`:''}<p class="mu">${days} days · ${new Date(a).toLocaleDateString()} to ${new Date(e-1).toLocaleDateString()}</p>

<p class="mu" style="text-align:center">Spendwise 1.3.0 · Your data stays on this phone</p>`+nav()}

// ---- Android bridge ----
const SND={'M-Pesa':'MPESA','Airtel Money':'AIRTEL','Equity Bank':'EQUITY',KCB:'KCB','Co-op Bank':'COOP'},
CT=[[/kplc|kenya power|water|zuku|wifi|dstv|gotv|safaricom home/i,'Bills and utilities'],[/uber|bolt|little|matatu|fuel|petrol|shell|rubis/i,'Transport'],[/naivas|quickmart|carrefour|chandarana|supermarket|butcher|mama|grocer|market|cafe|restaurant|kfc|java/i,'Food and groceries'],[/airtime|data|bundle/i,'Airtime and data'],[/rent|landlord/i,'Rent']],
tc=s=>s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()),
ban=()=>window.Android&&!Android.hasPermission()?`<div class="cd"><b>Allow Spendwise to read your messages</b><div class="mu" style="margin:6px 0 12px">Only messages from your chosen senders are read, never personal chats. Nothing leaves your phone.</div><button class="b" onclick="window.ask=1;Android.requestPermission()">Allow</button><button class="g" style="width:100%;margin-top:8px" onclick="Android.openSettings()">Open app settings</button></div>`:'';
function parse(m){const b=String(m.body).replace(/\s+/g,' ').trim(),a=(b.match(/(?:Ksh|KES)\.?\s?([\d,]+(?:\.\d+)?)/i)||[])[1];if(!a||/reversal|reversed/i.test(b))return;
const amt=+a.replace(/,/g,''),x={id:(b.match(/^([A-Z0-9]{8,12}) confirmed/i)||[])[1]||m.ts+'-'+amt,t:m.ts,a:amt,c:'Other',k:'t'};let r;
if(/fuliza/i.test(b)&&!/sent to|paid to/i.test(b)){x.y='l';x.n='Fuliza M-PESA'}
else if(/m-?shwari|kcb m-?pesa|own (?:account|a\/c)/i.test(b)){x.y='o';x.n=/m-?shwari/i.test(b)?'M-Shwari transfer':'Own account transfer'}
else if(/you have received|credited|deposit/i.test(b)){x.y='i';x.k='p';r=b.match(/from (.+?)(?= (?:\+?254|0)\d{8,9}| on \d| at \d|\.|$)/i);x.n='Received from '+(r?tc(r[1].trim()):'someone')}
else if(/airtime/i.test(b)){x.y='s';x.n='Airtime';x.c='Airtime and data'}
else if(/withdraw/i.test(b)){x.y='s';x.n='Cash withdrawal'}
else if(r=b.match(/(?:sent|paid) to (.+?)(?= (?:\+?254|0)\d{8,9}| on \d| at \d| for account|\.|$)/i)){x.y='s';x.k=/sent to .+? (?:\+?254|0)\d{8,9}/i.test(b)?'p':'t';x.n=(x.k=='p'?'Sent to ':'')+tc(r[1].trim())}
else if(/debited|purchase|spent/i.test(b)){x.y='s';x.n='Payment'}
else return;
if(x.y=='s'&&x.c=='Other'){const h=CT.find(z=>z[0].test(x.n));if(h)x.c=h[1]}return x}
function sync(){if(!window.Android||!Android.hasPermission())return;let raw=[];try{raw=JSON.parse(Android.readSms(365,Object.keys(S.src).filter(k=>S.src[k]).map(k=>SND[k]||k).join(',')))}catch(e){}SpendwiseImport(raw.map(parse).filter(Boolean))}
