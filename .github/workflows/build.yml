name: Build and release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"; then
            echo "KEYSTORE_BASE64 is not valid base64. Copy it again from your .jks file and update the secret."
            exit 1
          fi
          echo "Decoded key file size: $(wc -c < "$RUNNER_TEMP/release.jks") bytes (the correct size is 2606)"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/kt.txt" 2>&1; then
            cat "$RUNNER_TEMP/kt.txt"
            echo "The key file cannot be opened. Check KEYSTORE_PASSWORD, and copy KEYSTORE_BASE64 again."
            exit 1
          fi
          grep -E "entry|spendwise" "$RUNNER_TEMP/kt.txt"
      - name: Build
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk Spendwise.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Spendwise 1.0.${{ github.run_number }}
          files: Spendwise.apk
